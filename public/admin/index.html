<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#09090b">
<title>Owner Admin | Kush Welding Services</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="admin.css?v=b7c31f02">
</head>
<body class="app">
<header class="top" id="topbar" hidden>
  <div class="top-in">
    <a class="brand" href="../" target="_blank" rel="noopener" aria-label="Open website"><img src="../assets/brand/logo-full-onDark.svg" width="150" height="43" alt="Kush Welding Services"></a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Admin sections">
      <button role="tab" data-tab="ads" aria-selected="true">Advertisement</button>
      <button role="tab" data-tab="photos" aria-selected="false">Photos</button>
      <button role="tab" data-tab="account" aria-selected="false">Account</button>
    </nav>
    <div class="top-act">
      <a class="btn ghost sm" href="../" target="_blank" rel="noopener">View website &#8599;</a>
      <button class="btn ghost sm" id="logout" type="button">Log out</button>
    </div>
  </div>
</header>
<main id="login" class="login" hidden>
  <img class="login-logo" src="../assets/brand/logo-full-onDark.svg" width="222" height="64" alt="Kush Welding Services">
  <h1>Owner login</h1>
  <p class="muted">Manage your homepage advertisement and project photos.</p>
  <form id="loginForm" autocomplete="on" novalidate>
    <label for="pw">Password</label>
    <div class="pw-row">
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="pw-show" id="pwShow" aria-label="Show password" aria-pressed="false">Show</button>
    </div>
    <p class="form-err" id="loginErr" role="alert" hidden></p>
    <button class="btn gold block" id="loginBtn" type="submit">Log in</button>
  </form>
  <a class="back" href="../">&larr; Back to website</a>
</main>
<main id="app" class="page" aria-live="polite" hidden><p class="loading">Loading…</p></main>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="admin.js?v=b7c31f02"></script>
</body>
</html>
